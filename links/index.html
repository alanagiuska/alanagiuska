<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alana Giúska | Psicóloga e Supervisora Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-dark:#5d3926;
    --brown-light:#be896c;
    --cream:#f3e6da;
    --bg-page:#FFEED4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;
    min-height:100%;
    background:var(--bg-page);
    overflow-x:hidden;
    font-family:'Jost','Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    width:100%;
    min-height:100vh;
    margin:0 auto;
    background-color:var(--bg-page);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 24px 60px;
    position:relative;
    overflow:hidden;
  }

  /* Foto de topo: full-bleed, visivel apenas no mobile */
  .top-photo{
    display:none;
    width:100vw;
    max-width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    height:auto;
  }
  .profile-wrap{
    margin-top:64px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .profile-pic{
    width:92px;
    height:92px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ffffff;
    box-shadow:0 4px 16px rgba(93,57,38,0.35);
  }
  .handle{
    margin-top:12px;
    font-size:1.05rem;
    font-weight:500;
    color:var(--brown-dark);
    letter-spacing:0.4px;
    text-align:center;
  }
  .name-line{
    margin-top:2px;
    font-size:0.78rem;
    font-weight:300;
    color:var(--brown-dark);
    opacity:0.85;
    text-align:center;
    letter-spacing:0.2px;
  }
  .buttons{
    width:100%;
    max-width:380px;
    margin-top:24px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:58px;
    border-radius:16px;
    text-decoration:none;
    padding:0 52px;
    font-size:0.95rem;
    font-weight:600;
    letter-spacing:0.2px;
    line-height:1.3;
    box-shadow:0 4px 14px rgba(93,57,38,0.18);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active{
    transform:scale(0.97);
  }
  .btn-primary{
    background-color:#5d3926;
    color:#ffffff;
  }
  .btn-secondary{
    background-color:#be896c;
    color:#ffffff;
  }
  .btn-text{
    text-align:center;
  }
  .btn-icon{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    width:26px;
    height:26px;
    flex-shrink:0;
  }
  .btn-icon img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  @media (max-width:900px){
    .top-photo{display:block;}
    .profile-wrap{margin-top:-56px;}
    .handle{margin-top:8px;}
    .buttons{margin-top:18px;}
    footer{margin-top:22px;}
    .page{padding-bottom:36px;}
  }
  footer{
    margin-top:34px;
    font-size:0.7rem;
    font-weight:300;
    color:var(--brown-dark);
    opacity:0.6;
    text-align:center;
  }
</style>
</head>
